name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fazer checkout
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          # A versão vem do campo "packageManager" do package.json.
          # Definir "version" aqui duplicaria a fonte e causaria erro.
          run_install: false

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build de produção
        run: pnpm build

      - name: Instalar browser do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes end-to-end
        run: pnpm test:e2e
